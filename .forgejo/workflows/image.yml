name: Image

# Runs only for PRs / pushes to main that touch Dockerfile-related files.
# The production build is done by deploy-repo's build; the artifact is the registry image
# (ADR-0073 §1). The image baked here is **not pushed**. The goal is to "find out whether it is
# broken before it reaches the deploy path".
on:
  push:
    branches: [main]
    # ⚠ GitHub Actions YAML does not interpret anchors/aliases (&x / *x).
    #   The same list must also be written under pull_request. Adding to only one side breaks it.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".forgejo/workflows/image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".forgejo/workflows/image.yml"

# On consecutive pushes to the same branch (PR), cancel older runs and check only the latest commit.
# ⚠ **main is cancelled too** (decided 2026-09-28). Intermediate commits get no result, but in exchange
#   stale checks don't clog the runner queue on days with many pushes to main. Not applied to
#   workflows with side effects.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker build
    # ⚠ **Uses docker, so it runs on the dedicated runner** (the job image includes docker).
    #   ⚠ A job that lands here is **effectively host root**.
    runs-on: [nolumialab-docker]
    # ⚠ **Do not run on Renovate PRs** (task #603). This runner hands docker.sock to the job —
    #   CI runs on version-bump PRs before a human looks at them, so a malicious version in a
    #   dependency would take host root on the spot. A skipped job counts as green.
    if: github.event.pull_request.user.login != 'renovate'
    # ⚠ The default is 6 hours. Hung jobs eat up the quota and runners, so set a limit.
    timeout-minutes: 20
    # ⚠ **Use a distinct image name per run.** The host has a single docker, so with a shared name
    #   concurrent jobs (other repos created from the template, or a PR and main of the same repo)
    #   overwrite each other's image and tests run in the wrong image
    #   (2026-10-25: imggen's smoke test ran inside the fastapitemplate image and failed).
    env:
      CI_IMAGE: ci/${{ github.repository }}:${{ github.run_id }}-build
    steps:
      - uses: actions/checkout@v6

      # Same procedure as the "stamp the version" stage of build. Skip it and the image cannot
      # report its version.
      - name: Generate version info
        run: bash scripts/generate_version.sh
        env:
          BRANCH_OVERRIDE: ${{ github.head_ref || github.ref_name }}

      # ⚠ **Do not start a separate buildx driver** (same call as `blobshare` 3cc9765).
      #   On forge `cache-to: type=gha` is unreachable — act_runner's cache server listens on
      #   the runner container's IP, and there is no route from the buildkit container that the
      #   host daemon creates. Our self-hosted runner keeps a long-lived daemon, so a plain
      #   `docker build` reuses layers better.
      - name: Build (no push)
        run: docker build -t "$CI_IMAGE" .
          # ⚠ Not used: on forge the act_runner cache is unreachable from jobs.

      # Regression test that the version stamp works. If this falls back to dev, builds stay
      # green while shipping images that "can't tell which commit is running".
      - name: Check version.json is not dev
        run: |
          set -eu
          json=$(docker run --rm --entrypoint cat "$CI_IMAGE" /app/shared/kernel/version.json)
          echo "$json"
          echo "$json" | grep -q "\"commit_hash\": \"$(git rev-parse --short HEAD)\""

      # Names are per run, so leftovers pile up
      - name: Remove the image used for testing
        if: always()
        run: docker image rm -f "$CI_IMAGE" >/dev/null 2>&1 || true
