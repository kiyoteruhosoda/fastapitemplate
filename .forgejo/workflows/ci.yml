name: CI

# Two triggers: push (main only) and pull_request. If push covered all branches, a branch with a
# PR would verify the same commit twice (push and pull_request), doubling CI time (ADR-0072 §3).
# Note: since `branches` is set, tag pushes don't match this workflow (`v*` is release.yml).
on:
  push:
    branches: [main]
  pull_request:

# On consecutive pushes to the same branch (PR), cancel older runs and check only the latest commit.
# ⚠ **main is cancelled too** (decided 2026-09-28). Intermediate commits get no result, but in exchange
#   stale checks don't clog the runner queue on days with many pushes to main. Not applied to
#   workflows with side effects.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Quality gates (see CLAUDE.md "Tests" / docs/OPERATIONS.md)
#   Backend : Ruff Format → Ruff Check → MyPy → PyTest
#   Frontend: Prettier → ESLint → TypeScript → Vitest
# If any fails, the PR can't be merged. Each step runs even if an earlier one failed, so a
# single run reports all findings at once (`if: always()`).
jobs:
  backend:
    name: Backend (Python)
    # ⚠ **Runs on our self-hosted runner** (changed when moving to forge).
    runs-on: [self-hosted, nolumialab]
    # ⚠ The default is 6 hours. Hung jobs eat up the quota and runners, so set a limit.
    timeout-minutes: 25
    env:
      # Python installed by uv also comes from forge (default is GitHub's python-build-standalone).
      # If a version bump fails, add that tag's files to the astral-sh/python-build-standalone release.
      UV_PYTHON_INSTALL_MIRROR: "https://git.nolumia.com/astral-sh/python-build-standalone/releases/download"

    steps:
      - uses: actions/checkout@v6

      - name: Check Python version matches the production image
        # ⚠ **Tests use the `.python-version` version** (read by uv). Fail if it drifts from the
        #   production image (`FROM python:X.Y` in the Dockerfile). Renovate bumps both in one PR
        #   (task #461). CI had stayed on 3.12 while production moved to 3.14.
        run: |
          want="$(tr -d '[:space:]' < .python-version)"
          got="$(git ls-files 'Dockerfile' '*/Dockerfile' | xargs grep -hoE '^FROM +python:[0-9]+\.[0-9]+' | sed -E 's/^FROM +python://' | sort -u)"
          echo ".python-version: ${want} / Dockerfile: ${got//$'\n'/ }"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::.python-version (${want}) and Dockerfile FROM python (${got//$'\n'/ }) do not match"
            exit 1
          fi

      - name: Set up uv
        # ⚠ Pinned to an exact version here only. Since v8, setup-uv stopped publishing moving
        #   major tags like `@v10` as a supply-chain measure (to avoid tag-replacement attacks).
        #   Edit the version to upgrade.
        # ⚠ **Not on the mirror, so point at our own mirror by full URL** (since moving to forge).
        uses: https://git.nolumia.com/astral-sh/setup-uv@v10.0.1
        with:
          # No version pinned: use the latest in the manifest-file list (forge mirror, imported weekly).
          # With manifest-file set, the GitHub API is never called (2026-10-27).
          # ⚠ **The binary comes from forge** (no GitHub dependency). It lives in the astral-sh/uv
          #   releases, listed in uv.ndjson. host/astral-mirror imports the list weekly.
          manifest-file: "https://git.nolumia.com/astral-sh/uv/raw/branch/main/uv.ndjson"
          download-from-astral-mirror: false
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff Format (formatting)
        run: uv run ruff format --check .

      - name: Ruff Check (static analysis)
        if: always()
        run: uv run ruff check .

      - name: MyPy (type check)
        if: always()
        run: uv run mypy

      - name: PyTest (tests)
        if: always()
        run: uv run pytest -v --tb=short

  frontend:
    name: Frontend
    # ⚠ **Runs on our self-hosted runner** (changed when moving to forge).
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # ⚠ **Do not set node-version.** If set, setup-node fetches the list from api.github.com
      #   first even when pointed at a mirror (a GitHub dependency). Use Node 24 from the runner
      #   image (node:24-bookworm) as is.
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier (formatting)
        run: npm run format:check

      - name: ESLint (static analysis)
        if: always()
        run: npm run lint

      - name: TypeScript (type check)
        if: always()
        run: npm run type-check

      - name: Vitest (tests)
        if: always()
        run: npm run test

      - name: Build (Vite)
        if: always()
        run: npm run build
