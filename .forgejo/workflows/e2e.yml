name: E2E

# Smoke test that starts a real server and drives the UI in a real browser (Playwright)
# (ADR-0072 §6). Kept as a separate workflow from ci.yml's Backend / Frontend so the fast
# checks don't wait on it. Triggers and cancellation match ci.yml (ADR-0072 §3).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, nolumialab]
    # ⚠ The default is 6 hours. Hung jobs eat up the quota and runners, so set a limit.
    timeout-minutes: 25
    # Run the whole job inside the official Playwright image (browsers, OS deps and Node 24).
    # ⚠ Keep the image version equal to `@playwright/test` (the version check step below enforces it).
    # The digest is the multi-arch index digest of the tag on mcr.microsoft.com.
    # `--ipc=host` keeps Chromium from crashing on a small /dev/shm (recommended by Playwright).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    env:
      PLAYWRIGHT_VERSION: "1.65.0"
      # Python installed by uv also comes from forge (same as ci.yml).
      UV_PYTHON_INSTALL_MIRROR: "https://git.nolumia.com/astral-sh/python-build-standalone/releases/download"

    steps:
      - uses: actions/checkout@v6

      # Version and location are the same as ci.yml (reasons are there too).
      - name: Set up uv
        uses: https://git.nolumia.com/astral-sh/setup-uv@v10.0.1
        with:
          # No version pinned: use the latest in the manifest-file list (forge mirror, imported weekly).
          # With manifest-file set, the GitHub API is never called (2026-10-27).
          manifest-file: "https://git.nolumia.com/astral-sh/uv/raw/branch/main/uv.ndjson"
          download-from-astral-mirror: false

      - name: Install dependencies
        run: |
          uv sync
          cd frontend && npm ci

      # If the image tag and the `@playwright/test` version drift, browsers are not found and it
      # fails with "Executable doesn't exist". Stop early with a clear cause.
      - name: Check Playwright version matches the image
        working-directory: frontend
        run: |
          installed="$(npx playwright --version | awk '{print $2}' | tr -d '\r')"
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test is ${installed} but the image is ${PLAYWRIGHT_VERSION}. Align image and PLAYWRIGHT_VERSION in e2e.yml"
            exit 1
          fi

      # Frontend build -> migrations -> server start are done by webServer in playwright.config.ts.
      - name: E2E (Playwright)
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      # The report only displays results; it is not the verdict. A failed upload must not mask
      # why the job is red.
      # ⚠ v4 doesn't work on forge (treats it as GHES, only warns and doesn't upload). Use v3.
      - name: Keep the Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v3.2.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: warn
