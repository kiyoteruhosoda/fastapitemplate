# Non-secret settings and the nginx config.
#
# ⚠ **Keys not listed here never reach the container.** The app's setting keys and their meaning:
#   `.env.example` and `shared/kernel/settings/system_settings_defaults.py`.
#
# ⚠ **Values saved on the admin screen (DB) win** (ADR-0074 §1). If a change here has no effect,
#   first check whether the admin settings hold the same key.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: <app>-env
  namespace: <app>-<env>
data:
  TZ: "UTC"
  APP_ENV: "production"        # staging for stg
  # Trust only the one nginx hop in front to extract the client IP (ADR-0075 §1).
  TRUSTED_PROXY_HOPS: "1"
  APP_BASE_URL: "https://<host>"
  CORS_ALLOWED_ORIGINS: '["https://<host>"]'
  SESSION_COOKIE_SECURE: "true"
  # ⚠ **Passkeys are bound to this name.** Changing it makes every registered passkey
  #   unusable. **Decide the public name before setting it.**
  WEBAUTHN_RP_ID: "<host>"
  WEBAUTHN_ORIGIN: "https://<host>"
  WEBAUTHN_RP_NAME: "<App>"
  TOTP_ISSUER: "<App>"
  ACCESS_TOKEN_ISSUER: "<app>-<env>"
  ACCESS_TOKEN_AUDIENCE: "<app>-<env>"
  LOG_LEVEL: "INFO"
  # ── When using an external IdP (ADR-0077 §1 / ADR-0076 §3) ────────────────
  # ⚠ **Never write the key itself here.** The `private_key_jwt` private key is lent to the Pod
  #   from the host's `/srv/secrets/oidc` (see the comment in `40-app.yaml`).
  # OIDC_ENABLED: "true"
  # OIDC_ISSUER: "https://identity.nolumia.com/<tenant UUID>"
  # OIDC_CLIENT_ID: "…"
  # OIDC_REDIRECT_URI: "https://<host>/api/auth/sso/callback"
  # OIDC_CLIENT_AUTH_METHOD: "private_key_jwt"
  # OIDC_PRIVATE_KEY_FILE: "/run/oidc/client.key"
  # OIDC_PRIVATE_KEY_KID: "…"
  # ⚠ Defaults to false. Having an account at the idp is not enough to get in (add users from the admin screen)
  # OIDC_AUTO_PROVISION: "false"
---
# nginx config. ⚠ **Separate from `docker/nginx/default.conf.template` used for local development.**
# They were shared back when compose distributed it; now there is no bind mount
# (inode pinning keeps replacements from arriving). **When you fix one, fix the other.**
#
# ⚠ **`resolver` is CoreDNS (10.43.0.10).** The image default is docker's
#   `127.0.0.11`, which does not exist in k8s. It goes **together** with `proxy_pass` via a variable
#   — reverting to an `upstream` block makes nginx resolve once at startup and cache it,
#   returning 502 every time the app Pod is replaced.
# ⚠ **Write upstreams as FQDNs.** nginx's resolver ignores `search` in `/etc/resolv.conf`,
#   so the short `app` does not resolve even within the same namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: <app>-nginx
  namespace: <app>-<env>
data:
  default.conf: |
    resolver 10.43.0.10 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ⚠ **Only for publicly exposed stacks.** On a stack with no public route (LAN-only),
        #    whatever you list here becomes a hole as is
        #    — with no proxy in front, nobody is setting `X-Forwarded-For`.
        # ⚠ 10.42.0.1 is cbr0. Traffic from docker front proxies (cloudflared / edge-*) always
        #    appears as this address (measured 2026-09-06).
        # ⚠ 10.201.0.0/24 never shows up in remote_addr, but **the edge-* proxies append their
        #    own address to XFF**, so it is needed as an address to skip.
        set_real_ip_from 10.42.0.1;
        set_real_ip_from 10.201.0.0/24;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        client_max_body_size 100m;

        # ⚠ Do not expose externally (readable without authentication)
        location = /metrics {
            return 404;
        }

        location / {
            set $app_upstream http://app.<app>-<env>.svc.cluster.local:8000;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
