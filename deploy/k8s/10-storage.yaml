# Storage. **Two** volumes (the DB and the app data).
#
# ⚠ **A person creates the directories and their owners first.** PVs only declare; they don't create.
#
#     ssh nolumialab 'sudo mkdir -p /srv/k8s-local/<app>-<env>-db /srv/k8s-local/<app>-<env>-data'
#     ssh nolumialab 'sudo chown 999:999 /srv/k8s-local/<app>-<env>-db \
#       && sudo chmod 770 /srv/k8s-local/<app>-<env>-db'
#     ssh nolumialab 'sudo chown 5678:5678 /srv/k8s-local/<app>-<env>-data'
#
#   999 is `mysql` in the MariaDB image, 5678 is `appuser` in this image
#   (`ARG APP_UID` in the `Dockerfile`). **Change only one and the app can no longer write.**
#
# ⚠ **`local.path` cannot be changed later.** To move the storage, recreate the PV and
#   PVC. With `reclaimPolicy: Retain` the data stays (the default `Delete` would erase it).
#
# ⚠ **The production DB may live on an iSCSI LUN** (one carved out on the NAS).
#   The declaration keeps its shape — `local.path` just becomes `/srv/lun/<app>-<env>-db/db`.
#   Procedure: `k8s/lun/` in deploy-repo.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: <app>-<env>-db
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: node-local
  local: {path: /srv/k8s-local/<app>-<env>-db}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [nolumialab]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: <app>-<env>-data
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: node-local
  local: {path: /srv/k8s-local/<app>-<env>-data}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [nolumialab]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: <app>-<env>
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: node-local
  volumeName: <app>-<env>-db
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: <app>-<env>
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: node-local
  volumeName: <app>-<env>-data
  resources: {requests: {storage: 5Gi}}
