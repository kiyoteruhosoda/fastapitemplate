# app (FastAPI) and front (nginx).
#
# ⚠ **Do not use generic service names** (ADR-0073 §1 decision 8). `app` / `front` do not
#   collide because namespaces separate them, but renaming them also changes the FQDN in
#   `proxy_pass` in `20-config.yaml`.
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: <app>-<env>
spec:
  selector: {app: app}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: <app>-<env>
  labels:
    nolumia.dev/service: app
spec:
  # ⚠ **Do not declare the replica count** (same reason as `30-db.yaml`).
  selector:
    matchLabels: {app: app}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app: app}
    spec:
      securityContext:
        # The image's appuser is uid/gid 5678 (ARG APP_UID in the `Dockerfile`).
        # ⚠ **Keep in sync with the chown in `10-storage.yaml`.** Changing only one breaks writes.
        runAsUser: 5678
        runAsGroup: 5678
        # ⚠ **This replaces compose's `init-paths`.**
        fsGroup: 5678
        # ⚠ The default (Always) chowns recursively on every mount, so startup gets slower
        #   as the data grows.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          # ⚠ **Pin by digest.** With `:latest` the declaration never changes, so
          #   `kubectl apply` triggers no rollout and old Pods keep running.
          #   **Rewriting this line is what "bumping the version" means, and deck's pin stage
          #   does it mechanically** (write it by hand only the first time).
          image: hub.nolumia.com:5000/app/<image>:sha-<コミット>@sha256:<digest>
          args: ["web"]
          envFrom:
            - configMapRef: {name: <app>-env}
            - secretRef: {name: <app>-app}
          ports:
            - containerPort: 8000
          volumeMounts:
            - {name: app-data, mountPath: /app/data}
            # Only when using an external IdP with private_key_jwt. The key lives on the host at
            # /srv/secrets/oidc (0710) and is lent via hostPath.
            # - {name: oidc, mountPath: /run/oidc, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            # ⚠ **Keep this long.** On first start the entrypoint runs `alembic upgrade head`,
            #   so with an empty DB it waits for the whole schema build. Too short and it is
            #   killed mid-migration and never comes up.
            initialDelaySeconds: 660
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: app-data
          persistentVolumeClaim: {claimName: app-data}
        # - name: oidc
        #   hostPath: {path: /srv/secrets/oidc, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: <app>-<env>
spec:
  # **This Service is what is exposed to the LAN.**
  #
  # ⚠ **The number is in the default NodePort range (30000-32767).** It maps to the allocation as
  #   **`30000 + (allocated number - 10000)`** — 10510 in the allocation table becomes 30510.
  #   The allocation's source of truth is the Wiki "Port allocation"; **never grab a free number on your own.**
  #   compose uses the 10000s, so **numbers structurally never overlap with docker.**
  # ⚠ **Always write `nodePort`.** If omitted, some number in the range is auto-assigned and
  #   the mapping to the allocation breaks.
  # ⚠ **`externalTrafficPolicy: Local`.** With the default `Cluster`, kube-proxy SNATs and
  #   **every source collapses to `10.42.0.1`** (direct LAN access too), which
  #   breaks the premise of `set_real_ip_from`.
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: front}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 3xx10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: <app>-<env>
  labels:
    nolumia.dev/service: front
spec:
  # ⚠ **Do not declare the replica count** (same reason as `30-db.yaml`).
  selector:
    matchLabels: {app: front}
  # The Service owns the port, so Pods are not tied to it and RollingUpdate works.
  # With `maxUnavailable: 0`, **the old Pod is removed only after the new one is Ready**.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: front}
    spec:
      # ⚠ **Do not remove `preStop`.** Deleting a Pod and kube-proxy removing it from routing are
      #   **asynchronous**, so without it there is a window where it goes down before the route is
      #   removed, causing sporadic failures during rollout (measured 0.8% -> 0.1% with `preStop`).
      #   **Because the failures are scattered, they are hard to notice.**
      terminationGracePeriodSeconds: 30
      containers:
        - name: front
          image: nginx:1.30-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
          ports:
            # ⚠ **Do not set `hostPort`** (the Service owns the port).
            - containerPort: 80
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 70
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: conf
          configMap: {name: <app>-nginx}
