# db (MariaDB).
#
# ⚠ **A Deployment + a pre-existing PVC, not a StatefulSet.** A PVC created by a StatefulSet's
#   `volumeClaimTemplates` survives deleting the StatefulSet, so names can
#   collide and the new one may grab the old PVC. Also, a StatefulSet cannot change
#   anything in `spec` except `replicas` afterwards (it must be recreated).
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: <app>-<env>
spec:
  selector: {app: db}
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: <app>-<env>
  labels:
    nolumia.dev/service: db
spec:
  # ⚠ **Do not declare the replica count.** The single source of truth is deck's scale.
  #   Writing it here makes `apply` wake a stopped environment (it resets 0 to the declared value).
  selector:
    matchLabels: {app: db}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          # ⚠ **Pin third-party images by digest too.** The same tag does not
          #   guarantee the same content (`mariadb:10.11` really differed between namespaces).
          image: mariadb:10.11@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008
          args: ["--default-time-zone=+00:00"]
          env:
            - {name: TZ, value: UTC}
          envFrom:
            - secretRef: {name: <app>-db}
          ports:
            - containerPort: 3306
          volumeMounts:
            - {name: db-data, mountPath: /var/lib/mysql}
          readinessProbe:
            exec:
              # ⚠ `--protocol=tcp` is required. Over the socket it also reaches the temporary
              #   server used during initialization and reports a not-yet-usable DB as ready.
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p"$MARIADB_ROOT_PASSWORD" --silent
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: db-data
          persistentVolumeClaim: {claimName: db-data}
