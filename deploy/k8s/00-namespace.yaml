# Put <app>-<env> on k3s (ADR-0073 §1).
#
# ⚠ **The real location is deploy-repo's `k8s/<app>-<env>/`.** This directory is its template;
#   replace `<app>` / `<env>` / port numbers / digests before copying it.
#   A real example is deploy-repo's `k8s/fastapitemplate-stg/`.
#
# ⚠ **The unit of apply is the directory** (all `.yaml` in `k8s/<app>-<env>/`,
#   non-recursive). The number in the file name sets the apply order.
---
apiVersion: v1
kind: Namespace
metadata:
  name: <app>-<env>
  labels:
    # ⚠ **These 3 labels are how deck lists environments.** Drop them and it does not show up
    #   (= cannot start, stop, or bump the version).
    nolumia.dev/managed-by: nolumiadeck
    nolumia.dev/project: <app>
    nolumia.dev/environment: <env>
