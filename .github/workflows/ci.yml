name: CI

# トリガーは push（main のみ）と pull_request の 2 つ。push を全ブランチ対象にすると、
# PR のあるブランチでは同じコミットが push 側と pull_request 側で 2 回検証され、
# CI 時間が丸ごと二重になる（ADR-0009）。
# ※ `branches` を指定しているのでタグ push はこのワークフローに一致しない（`v*` は release.yml）。
on:
  push:
    branches: [main]
  pull_request:

# 同じ PR（push は同じブランチ）への連続 push では、古い実行を止めて最新だけを検証する。
# main は「どのコミットが緑だったか」の記録を残したいのでキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 品質ゲート（CLAUDE.md「テスト」／docs/OPERATIONS.md 参照）
#   Backend : Ruff Format → Ruff Check → MyPy → PyTest
#   Frontend: Prettier → ESLint → TypeScript → Vitest
# いずれかが落ちたらマージできない。各ステップは前段が落ちても実行し、
# 1 回の実行でまとめて指摘が出るようにする（`if: always()`）。
jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        # ⚠ ここだけ完全な版で固定する。setup-uv は v8 以降、
        #   サプライチェーン対策として `@v10` のような動く major タグの発行をやめた
        #   （タグを差し替えられる攻撃を避けるため）。上げるときは版を書き換える。
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff Format (コード整形)
        run: uv run ruff format --check .

      - name: Ruff Check (静的解析)
        if: always()
        run: uv run ruff check .

      - name: MyPy (型チェック)
        if: always()
        run: uv run mypy

      - name: PyTest (テスト)
        if: always()
        run: uv run pytest -v --tb=short

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier (コード整形)
        run: npm run format:check

      - name: ESLint (静的解析)
        if: always()
        run: npm run lint

      - name: TypeScript (型チェック)
        if: always()
        run: npm run type-check

      - name: Vitest (テスト)
        if: always()
        run: npm run test

      - name: Build (Vite)
        if: always()
        run: npm run build
