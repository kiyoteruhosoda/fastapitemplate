# compose for local development. **Not used for deployment.**
#
# Deployment targets k3s and has no compose (declarations: deploy-repo's k8s/<app>-<env>/,
# template: deploy/k8s/; ADR-0073 §1). Service names (app / front), how the upstream is resolved,
# and trusting only the one proxy hop in front are kept identical to the deployment
# — to avoid "works locally, 502 once deployed".
# ⚠ **Only the nginx config is not shared** (the resolver differs between docker and k8s).
#   When you fix one, fix the other.
#
# Usage:
#   docker build -t fastapitemplate:dev .   (or make image)
#   cp .env.example .env
#   docker compose up -d                    → http://127.0.0.1:8080

services:
  init-paths:
    image: alpine:3
    command: >
      sh -c "
        echo '[init] ensure dirs exist';
        mkdir -p /host/db_data /host/data;
        echo '[init] apply correct ownership';
        chown -R 999:999 /host/db_data;
        chmod -R 770 /host/db_data;
        chown -R ${APP_UID:-5678}:${APP_GID:-5678} /host/data;
        chmod -R 775 /host/data;
        echo '[init] done';
      "
    volumes:
      - ${HOST_DATA_ROOT:-./mnt}:/host
    restart: "no"

  db:
    # Plain MariaDB. compose only pins the time zone.
    image: ${DB_IMAGE:-mariadb:10.11}
    environment:
      - TZ=UTC
      # Defaults let the DB initialize even with initial setup only (no .env / unset entries).
      # The default credentials are for development. Deployments pass them from a sealed Secret.
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-template123}
      - MARIADB_USER=${MARIADB_USER:-web_user}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-template123}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-appdb}
    # The DB is not exposed to the host. It is reachable only inside the Docker network, and
    # maintenance stays inside the container via `docker compose exec db mariadb ...` (ADR-0071 §2).
    expose:
      - "3306"
    volumes:
      - ${HOST_DATA_ROOT:-./mnt}/db_data:/var/lib/mysql
    command:
      - --default-time-zone=+00:00
    depends_on:
      init-paths:
        condition: service_completed_successfully
    healthcheck:
      # Escaped with $$ so compose does not expand the password and the container shell's env var
      # reference is passed as is. --protocol=tcp is explicit: over the socket, ping also reaches the
      # temporary bootstrap server during first initialization and is wrongly judged healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 10s
      # First start (empty db_data) can take minutes to initialize the system tables.
      # The probe still runs every interval during start_period and turns healthy on success,
      # so a long value does not slow down later starts.
      retries: 30
      start_period: 600s

  app:
    image: ${WEB_IMAGE:-fastapitemplate:dev}
    networks:
      # front resolves this alias (in the deployment, the Service name `app` inside the namespace).
      default:
        aliases:
          - ${APP_WEB_ALIAS:-fastapitemplate-app}
    init: true
    stop_grace_period: 60s
    command: web
    # front (nginx) owns the public port. app is reachable only from inside the network.
    expose:
      - "8000"
    environment:
      - TZ=UTC
      - DATABASE_URI=mysql+pymysql://${MARIADB_USER:-web_user}:${MARIADB_PASSWORD:-template123}@db:3306/${MARIADB_DATABASE:-appdb}?charset=utf8mb4
      # Trust only the one nginx hop in front to extract the client IP (any other
      # X-Forwarded-For can be spoofed, so it is ignored). app only uses expose and
      # cannot be reached from anything but front.
      - TRUSTED_PROXY_HOPS=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${HOST_DATA_ROOT:-./mnt}/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 10s
      # Even after db is healthy, app waits for the DB connection and runs alembic upgrade head
      # before starting. The first run (empty DB) includes building the schema, so allow plenty of time.
      retries: 5
      start_period: 300s

  front:
    image: nginx:1.30-alpine
    # Public front. An external reverse proxy connects to this port.
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-8080}:80"
    environment:
      - TZ=UTC
      # Fills ${APP_WEB_ALIAS} in default.conf.template with this value (envsubst).
      - APP_WEB_ALIAS=${APP_WEB_ALIAS:-fastapitemplate-app}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-fastapitemplate}
