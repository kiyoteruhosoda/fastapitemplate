[project]
name = "fastapitemplate"
version = "0.2.0"
description = "FastAPI + DDD template (photonest-based) – Clean Architecture / DDD"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "gunicorn>=23.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sqlalchemy>=2.1",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "werkzeug>=3.0.0",
    "pydantic[email]>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "webauthn>=2.5.0",
    "qrcode>=8.0",
    # SSO (discovery, token exchange, UserInfo). ADR-0077 §1
    "httpx>=0.28.1",
    "boto3>=1.40",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.104",
    "httpx2>=2.13.1",
    "mypy>=1.14",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
    "types-qrcode>=8.2.0.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
# importlib: avoid clashes between same-named test files / smtp: excluded by default (needs an external resource)
addopts = "--import-mode=importlib -m 'not smtp'"
markers = [
    "smtp: requires a real SMTP server (excluded by default)",
]

[tool.mypy]
python_version = "3.15"

# What to check. This layout has no "src/", so list the actual package roots
# (so a bare `uv run mypy` is the quality gate as is).
files = [
    "asgi.py",
    "main.py",
    "bounded_contexts",
    "migrations",
    "presentation",
    "scripts",
    "shared",
    "tests",
]

strict = true

pretty = true
show_error_codes = true
show_column_numbers = true

disallow_any_generics = true
disallow_subclassing_any = true

disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true

no_implicit_optional = true

warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

implicit_reexport = false

# pywebpush / py_vapid ship no type information (py.typed) (ADR-0081 §3).
[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: PEP 8 compliance
    "F",    # Pyflakes: unused variables / imports
    "I",    # isort: import order
    "B",    # flake8-bugbear: bug-prone patterns
    "UP",   # pyupgrade: detect outdated Python syntax
    "SIM",  # flake8-simplify: simplify needless branches
    "C4",   # flake8-comprehensions: better comprehensions
    "ARG",  # flake8-unused-arguments: unused arguments
    "N",    # pep8-naming: naming conventions
    "RET",  # flake8-return: better returns
    "PTH",  # flake8-use-pathlib: prefer pathlib
    "RUF",  # Ruff-specific rules
    # Quantitative design-quality limits (ADR-0072 §4). Thresholds are in the mccabe / pylint sections below.
    "C901",    # mccabe: cyclomatic complexity
    "PLR0912", # number of branches
    "PLR0913", # number of arguments
    "PLR0915", # number of statements (function length)
]

ignore = [
    # Calling FastAPI's Depends()/Cookie()/Query() in argument defaults is the correct usage
    "B008",
    # This project contains Japanese text; full-width brackets and commas are intentional.
    # RUF001-003 (ambiguous-unicode-character) only produce false positives, so they are excluded.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
# 10 per the development standard (5 is recommended, but that is checked in review. ADR-0072 §4)
max-complexity = 10

[tool.ruff.lint.pylint]
# The standard is 3 arguments or fewer, but the machine check uses 4, because Ruff also counts
# `Depends()` injections and optional keyword-only arguments (ADR-0072 §4).
max-args = 4
max-branches = 8
# Function length is measured in statements, not lines (30 lines ≈ 30 statements. ADR-0072 §4)
max-statements = 30

[tool.ruff.lint.per-file-ignores]
# ARG001: pytest fixtures are sometimes received as arguments without being referenced
# ARG002: test doubles declare unused arguments to satisfy the interface
# PLR0913: test function arguments are fixture injections, not a design-level argument count
"tests/*" = ["ARG001", "ARG002", "PLR0913"]
