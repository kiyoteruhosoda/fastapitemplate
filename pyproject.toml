[project]
name = "fastapitemplate"
version = "0.2.0"
description = "FastAPI + DDD template (photonest-based) – Clean Architecture / DDD"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "gunicorn>=23.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "werkzeug>=3.0.0",
    "pydantic[email]>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "webauthn>=2.5.0",
    "qrcode>=8.0",
    # SSO（discovery・トークン交換・UserInfo）。ADR-0025
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
    "types-qrcode>=8.2.0.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
# importlib: 同名テストファイルの衝突回避 / smtp: 外部リソース要のため既定除外
addopts = "--import-mode=importlib -m 'not smtp'"
markers = [
    "smtp: requires a real SMTP server (excluded by default)",
]

[tool.mypy]
python_version = "3.12"

# 検査対象。この構成に "src/" は無いため、実際のパッケージルートを列挙する
# （引数なしの `uv run mypy` がそのまま品質ゲートになる）。
files = [
    "asgi.py",
    "main.py",
    "bounded_contexts",
    "migrations",
    "presentation",
    "scripts",
    "shared",
    "tests",
]

strict = true

pretty = true
show_error_codes = true
show_column_numbers = true

disallow_any_generics = true
disallow_subclassing_any = true

disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true

no_implicit_optional = true

warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

implicit_reexport = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: PEP8 準拠
    "F",    # Pyflakes: 未使用変数・import
    "I",    # isort: import 順
    "B",    # flake8-bugbear: バグになりやすい記述
    "UP",   # pyupgrade: 古い Python 構文の検出
    "SIM",  # flake8-simplify: 不要な分岐の簡略化
    "C4",   # flake8-comprehensions: comprehension 改善
    "ARG",  # flake8-unused-arguments: 未使用引数
    "N",    # pep8-naming: 命名規則
    "RET",  # flake8-return: return 改善
    "PTH",  # flake8-use-pathlib: pathlib 利用推奨
    "RUF",  # Ruff 独自ルール
    # 設計品質の定量基準（ADR-0012）。閾値は下の mccabe / pylint セクション。
    "C901",    # mccabe: 循環複雑度
    "PLR0912", # 分岐の数
    "PLR0913", # 引数の数
    "PLR0915", # 文の数（関数の長さ）
]

ignore = [
    # FastAPI の Depends()/Cookie()/Query() は引数デフォルトでの呼び出しが正しい用法
    "B008",
    # 本プロジェクトのコメント・docstring は日本語であり、全角括弧・読点は意図的な表記。
    # RUF001-003（ambiguous-unicode-character）は誤検知にしかならないため除外する。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
# 開発標準どおり 10（推奨は 5 だが、それを下回るかはレビューで見る。ADR-0012）
max-complexity = 10

[tool.ruff.lint.pylint]
# 引数 3 個以下という標準に対し、機械検証は 4 で行う。Ruff は `Depends()` による
# 依存注入とキーワード専用の任意引数も 1 個として数えるため（ADR-0012）。
max-args = 4
max-branches = 8
# 関数の長さは行数ではなく文の数で見る（30 行以下 ≒ 文 30 個以下。ADR-0012）
max-statements = 30

[tool.ruff.lint.per-file-ignores]
# ARG001: pytest フィクスチャは引数として受け取るだけで参照しないことがある
# ARG002: テストダブルはインターフェースを満たすために使わない引数も宣言する
# PLR0913: テスト関数の引数はフィクスチャの注入であり、設計上の引数の多さではない
"tests/*" = ["ARG001", "ARG002", "PLR0913"]
